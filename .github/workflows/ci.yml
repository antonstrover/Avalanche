name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python tests, format, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      # Exit code 5 means pytest found no tests yet. The early stages of
      # docs/PLAN.md have not added test files. A real exit code still fails
      # the job once tests exist.
      - name: Run tests (including the determinism test)
        run: |
          uv run pytest || code=$?
          if [ "${code:-0}" -eq 5 ]; then
            echo "No tests collected yet."
            exit 0
          fi
          exit "${code:-0}"

  dashboard:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dashboard/package.json does not exist yet in early stages of
      # docs/PLAN.md. Every later step checks for it and no-ops until it does.
      - name: Set up Node
        if: hashFiles('dashboard/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
        run: npm ci

      - name: Lint
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
        run: npm run lint --if-present

      - name: Unit tests
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
        run: npm run test --if-present

      - name: Build
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
        run: npm run build --if-present
