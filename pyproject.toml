[project]
name = "avalanche"
version = "0.1.0"
description = "Ski-resort simulator with AI controllers and AI monitors"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "gymnasium",
    "torch",
    "pyyaml",
    "pyarrow",
    "pandas",
    "scipy",
    "networkx",
    "fastapi",
    "uvicorn[standard]",
    "msgpack",
    "pydantic",
]

[project.scripts]
avalanche = "avalanche.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "matplotlib",
    "ruff",
    "mypy>=2.3.1",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avalanche"]
