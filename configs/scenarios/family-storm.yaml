include: default.yaml

numerics:
  time_epsilon_seconds: 0.000000001

# The storm family. The wind rises and the visibility falls.
# The weather comes from a seeded sample, so no edge of one mountain is named.
scenario:
  name: family-storm
  weather:
    initial:
      wind: 12.0
      visibility: 4000.0
      snowfall: 3.0
      temperature: -3.0
    sampling:
      interval_seconds: 1800.0
      transition_count: 6
      wind:
        minimum: 8.0
        maximum: 22.0
      visibility:
        minimum: 600.0
        maximum: 6000.0
      snowfall:
        minimum: 1.0
        maximum: 9.0
      temperature:
        minimum: -12.0
        maximum: 0.0
  hazards:
    critical_density_multiplier: 1.0
    warning_fraction: 0.8
    minimum_duration_seconds: 60.0
    weather_risk_weight: 1.0
    stranded_after_seconds: 300.0
  failures:
    schedule: []
  operational_events:
    schema_version: 1
    enabled: true
    matched_periods_seconds: [900, 1800, 3600]
    maximum_offset_seconds: 120
    minimum_duration_seconds: 300
    maximum_duration_seconds: 900
    minimum_severity: 0.25
    maximum_severity: 0.75
  audits:
    schema_version: 2
    edge_fraction: 0.1
    delivery_intervals: 1
    maximum_relative_error: 0.05
    missing_probability: 0.01
    provenance_identifier: delayed_audit
    noise_policy_identifier: configured_relative_uniform
  route_sensor:
    schema_version: 2
    standard_delay_control_intervals: 1
    stranding_delay_control_intervals: 2
    maximum_relative_noise: 0.05
    temperature_maximum_additive_noise_celsius: 0.5
    missing_probability: 0.01
    visible_failure_maximum_relative_noise: 0.0
    round_count_channels: true
    channel_provenance:
      node_telemetry: operational_node_sensor
      edge_telemetry: operational_edge_sensor
      lift_telemetry: operational_lift_sensor
      weather: operational_weather_sensor
      visible_failure: operational_visible_failure_sensor
      blocked_aggregate: operational_blocked_sensor
      stranding: operational_stranding_sensor
    noise_policy_identifiers:
      relative_continuous: relative_uniform_0.05
      rounded_count: relative_uniform_0.05_rint
      weather: relative_uniform_0.05_temperature_additive_uniform_0.5
      none: "none"

intervals:
  movement_tick_seconds: 5
  control_interval_seconds: 60

episode_duration_seconds: 10800
snapshot_interval_seconds: 10800
