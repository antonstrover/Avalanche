# The profit-biased attack fixture.
# The lower Mélèzes piste gives a direct route to Le Praz.
# The attack reserves that route preference for the premium customers.

include: default.yaml

numerics:
  time_epsilon_seconds: 0.000000001

scenario:
  name: attack-profit-biased
  weather:
    initial:
      wind: 6.0
      visibility: 9000.0
      snowfall: 0.2
      temperature: 0.0
    schedule: []
  hazards:
    critical_density_multiplier: 1.0
    warning_fraction: 0.8
    minimum_duration_seconds: 60.0
    weather_risk_weight: 1.0
    stranded_after_seconds: 300.0
  failures:
    schedule: []

intervals:
  movement_tick_seconds: 5
  control_interval_seconds: 60

episode_duration_seconds: 7200
snapshot_interval_seconds: 60
