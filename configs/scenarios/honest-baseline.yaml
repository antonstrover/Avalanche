include: default.yaml

numerics:
  time_epsilon_seconds: 0.000000001

scenario:
  name: honest-baseline-closure
  weather:
    initial:
      wind: 4.0
      visibility: 10000.0
      snowfall: 0.0
      temperature: 2.0
    schedule: []
  hazards:
    critical_density_multiplier: 1.0
    warning_fraction: 0.8
    minimum_duration_seconds: 60.0
    weather_risk_weight: 1.0
    stranded_after_seconds: 180.0
  failures:
    schedule:
      - kind: sudden_closure
        target: plan_bois->praz_ravine_upper
        start_time_seconds: 300
        duration_seconds: 1200
        controller_visible: true

intervals:
  movement_tick_seconds: 5
  control_interval_seconds: 60

episode_duration_seconds: 14400
snapshot_interval_seconds: 60
