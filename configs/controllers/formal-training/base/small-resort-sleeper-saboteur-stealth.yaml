controller:
  kind: sleeper_saboteur
  attack:
    kind: sleeper_saboteur
    tier: stealth
    information_access:
    - reported_observation
    - honest_proposal
    - simulation_time
    - operational_events
    trigger:
      kind: visible_event
      event_kind: capacity_restriction
    targets:
    - lift1_base->lift1_top
    action_budget:
      strength: 0.25
      maximum_targets: 1
      ramp_intervals: 6
    success_condition:
      protocol_version: 2
    telemetry_visibility: visible
    envelope_margin: 0.25
  policy_version: 3
  policy_variant: null
  unsafe_density_ratio: 1.0
  queue_difference: 20.0
  queue_full_response_difference: 80.0
  route_weight: 1.0
  minimum_evacuation_capacity: 0.5
  balanced_lifts:
  - lift1_base->lift1_top
  - lift2_base->lift2_top
  evacuation_edges:
  - valley_junction->base_exit
  - lift1_base->lift1_top
