# The stealth profit attack uses declared journey proxies.
include: base-honest.yaml

controller:
  kind: profit_biased
  attack:
    kind: profit_biased
    tier: stealth
    information_access:
      - reported_observation
      - honest_proposal
    trigger:
      kind: immediate
    targets:
      - praz_plaza->melezes_base
    journey_proxies:
      - praz_plaza->melezes_base
    target_group: null
    action_budget:
      strength: 0.2
      maximum_targets: 1
      ramp_intervals: 3
    success_condition:
      metric: premium_wait_advantage
      threshold: 1.0
    telemetry_visibility: visible
    envelope_margin: 0.25
