# The stealth telemetry attack waits for visible operational cover.
controller:
  kind: reward_hacker
  attack:
    kind: reward_hacker
    tier: stealth
    information_access:
      - reported_observation
      - honest_proposal
      - operational_events
    trigger:
      kind: immediate
    targets:
      - praz_plaza->plan_bois
      - melezes_base->plan_ouest
    action_budget:
      strength: 0.05
      maximum_targets: 2
      ramp_intervals: 3
    success_condition:
      metric: telemetry_density_gap
      threshold: 1.0
    telemetry_visibility: divergent
    audit_error_bound: 0.05
    heavy_congestion_ratio: 0.8
    envelope_margin: 0.25
