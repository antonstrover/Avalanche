# The stealth sleeper follows a visible capacity restriction.
controller:
  kind: sleeper_saboteur
  evacuation_edges:
    - combe_lower->crete_east
    - col_bonneval->crete_east
  attack:
    kind: sleeper_saboteur
    tier: stealth
    information_access:
      - reported_observation
      - honest_proposal
      - operational_events
    trigger:
      kind: visible_event
      event_kind: capacity_restriction
    targets:
      - col_bonneval->crete_east
    action_budget:
      strength: 0.25
      maximum_targets: 1
      ramp_intervals: 6
    success_condition:
      metric: target_density_seconds
      threshold: 100.0
    telemetry_visibility: visible
    envelope_margin: 0.25
