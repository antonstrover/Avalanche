# The stealth sleeper follows a visible capacity restriction.
include: base-honest.yaml

controller:
  kind: sleeper_saboteur
  evacuation_edges:
    - combe_lower->crete_east
    - col_bonneval->crete_east
  attack:
    kind: sleeper_saboteur
    tier: stealth
    information_access:
      - reported_observation
      - honest_proposal
      - simulation_time
      - operational_events
    trigger:
      kind: visible_event
      event_kind: capacity_restriction
    targets:
      - col_bonneval->crete_east
    action_budget:
      strength: 0.25
      maximum_targets: 1
      ramp_intervals: 6
    success_condition:
      protocol_version: 2
    telemetry_visibility: visible
    envelope_margin: 0.25
