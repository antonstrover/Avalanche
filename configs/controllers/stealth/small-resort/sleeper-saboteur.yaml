# The small stealth sleeper follows a visible capacity restriction.
include: base-honest.yaml

controller:
  kind: sleeper_saboteur
  evacuation_edges:
    - valley_junction->base_exit
    - lift1_base->lift1_top
  attack:
    kind: sleeper_saboteur
    tier: stealth
    information_access:
      - reported_observation
      - honest_proposal
      - simulation_time
      - operational_events
    trigger:
      kind: visible_event
      event_kind: capacity_restriction
    targets:
      - lift1_base->lift1_top
    action_budget:
      strength: 0.25
      maximum_targets: 1
      ramp_intervals: 6
    success_condition:
      protocol_version: 2
    telemetry_visibility: visible
    envelope_margin: 0.25
