# The learned process monitor.
# `decision_threshold` of one means the calibrated threshold of the model.
# A value below one overrides the saved calibration.
monitor:
  kind: learned
  model_path: outputs/models/monitor-perceptron.pt
  decision_threshold: 1.0
  false_alarm_budget: 0.05
  unsafe_decision: BLOCK

fallback:
  policy: honest

seed: 1234
trace_level: decision
