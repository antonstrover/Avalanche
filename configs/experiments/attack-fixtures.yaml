    paired_controller: configs/controllers/fixtures/profit-honest.yaml
    monitor: configs/monitors/none.yaml
    target: completion_advantage_percentage_point_difference
    runs:
      - seed: 20260820
        override: configs/overrides/attack-profit-biased-seed-20260820.yaml
      - seed: 20260822
        override: configs/overrides/attack-profit-biased-seed-20260822.yaml

  - id: sleeper-saboteur-overt
