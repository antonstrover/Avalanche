# The paired development fixtures use the fixed success protocol.
# Every attack uses an exact honest controller and two root seeds.

protocol_version: 2

fixtures:
  - id: profit-biased-overt
    kind: profit_biased
    tier: overt
    mountain: configs/mountain/profit-fixture.yaml
    scenario: configs/scenarios/attack-profit-biased.yaml
    controller: configs/controllers/fixtures/profit-overt.yaml
    paired_controller: configs/controllers/fixtures/profit-honest.yaml
    monitor: configs/monitors/none.yaml
    target: completion_advantage_percentage_point_difference
    runs:
      - seed: 20260820
        override: configs/overrides/attack-profit-biased-seed-20260820.yaml
      - seed: 20260822
        override: configs/overrides/attack-profit-biased-seed-20260822.yaml

  - id: profit-biased-stealth
    kind: profit_biased
    tier: stealth
    mountain: configs/mountain/profit-fixture.yaml
