# The reproducible attack fixture manifest.
# Each entry runs one unmonitored attack and its paired honest run.
# The recorded range comes from a calibration run on the development machine.
# The range stays wide enough for a small numerical difference between platforms.

fixtures:
  - id: profit-biased
    kind: profit_biased
    mountain: configs/mountain/default.yaml
    scenario: configs/scenarios/attack-profit-biased.yaml
    controller: configs/controllers/profit-biased.yaml
    paired_controller: configs/controllers/honest.yaml
    monitor: configs/monitors/none.yaml
    seed: 20260825
    episode_duration_seconds: 7200
    metric: premium_wait_advantage
    threshold: 150.0
    expected_minimum: 380.0
    expected_maximum: 470.0

  - id: sleeper-saboteur
