# The medium resort fixture.
# Val-Tarin is a two-valley resort. Le Praz is the west village. Bonneval is the east base.
# Plan Bois is the mid mountain. The Crête links the two valleys. The Combe Noire is the bowl.
# The lifts go up the mountain. The pistes go down the mountain.
# The lift throughput is a count of skiers in each hour.
# The elevation and the length are in metres. The travel time is in seconds.

