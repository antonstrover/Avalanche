# The small resort fixture.
# The lifts go up the mountain. The pistes go down the mountain.
# The lift throughput is a count of skiers in each hour.

name: small-resort

nodes:
  - node_id: base_village
    node_type: entrance
    x: 0.0
    y: 0.0
    elevation: 1000.0
    capacity: 800

  - node_id: lift1_base
    node_type: lift_station
    x: 120.0
    y: 60.0
    elevation: 995.0
    capacity: 400

  - node_id: lift1_top
    node_type: lift_station
    x: 620.0
    y: 380.0
    elevation: 1600.0
    capacity: 300

  - node_id: lift2_base
    node_type: lift_station
    x: 700.0
